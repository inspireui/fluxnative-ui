name: Bug report
description: Something in a FluxNative UI package doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Found a security problem? Don't file it here: follow [SECURITY.md](https://github.com/inspireui/fluxnative-ui/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Code to reproduce
      description: The smallest screen or component that shows the problem.
      render: tsx
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FluxNative UI version
      description: The `@fluxnative/*` version, or the commit if you build from the repo.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      multiple: true
      options:
        - iOS 26 or later
        - iOS before 26
        - Android
        - Web
        - Flux WebView (runtime styling)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Expo SDK 57, React Native 0.86, iPhone 16 simulator
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
